[package]
name = "ubuntu-app-control"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Review installed apps, clear their cache or data safely, and choose which GPU launches them"
license = "MIT"
readme = "README.md"
authors = ["Ubuntu App Control contributors"]
keywords = ["gtk4", "ubuntu", "appimage", "snap", "desktop"]
categories = ["gui", "system"]

[dependencies]
gtk4 = "0.10"
glib = "0.21"
gio = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
