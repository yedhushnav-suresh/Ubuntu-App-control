name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev \
            python3-gi gir1.2-gdkpixbuf-2.0 \
            desktop-file-utils dpkg-dev

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n build-deb.sh

      - name: Validate desktop entry
        run: desktop-file-validate packaging/com.local.UbuntuAppControl.desktop

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Build Debian package
        run: ./build-deb.sh

      - name: Inspect package
        run: dpkg-deb -I dist/ubuntu-app-control_*_amd64.deb

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-app-control-deb
          path: dist/*.deb
          if-no-files-found: error
